[project]
name = "vagas-pj-bot"
version = "0.1.0"
description = "Bot diário de vagas PJ de IA/ML com scoring local via Ollama."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tenacity>=8.3",
    "rich>=13.7",
    "ollama>=0.4",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
st = ["sentence-transformers[train]>=6.2", "torch>=2.15", "datasets>=3.0", "scipy>=1.14"]  # [train] traz o accelerate exigido pelo Trainer

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: testes que chamam o Ollama ou APIs reais (fora do padrão)",
]

[tool.uv.build-backend]
module-name = "vagas_bot"

# PyTorch com CUDA 13.2 (RTX 5070 Ti / Blackwell exige CUDA 12.8+). Só para o extra "st".
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
